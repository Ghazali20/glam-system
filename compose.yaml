version: '3.8'

networks:
  glam_internal:
    driver: bridge

volumes:
  glam_db_data:
    driver: local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glam-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
    networks:
      - glam_internal
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: glam-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - glam_db_data:/var/lib/mysql
    networks:
      - glam_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
